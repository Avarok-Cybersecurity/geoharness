name: core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm32-unknown-unknown build
        run: cargo build -p geoharness-wasm --target wasm32-unknown-unknown --release
      - name: bindings (wasm-bindgen-cli pinned to Cargo.lock)
        run: scripts/build-wasm.sh
      - name: wasm smoke test in Node
        run: node scripts/smoke-wasm.mjs
      - name: generated TypeScript types are current
        run: cargo run -p xtask -- gen-types --check
