name: host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: dist/cli.mjs is up to date
        run: npm run check:dist
      - name: Generated README and site sections are current
        run: npm run check:docs
